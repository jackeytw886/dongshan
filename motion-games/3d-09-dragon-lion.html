<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07. 舞龍舞獅感應遊戲 — 雙螢幕展演</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 共用模組（請與本檔放在同一資料夾）：體感偵測 / 雙視窗 / 線條圖示 -->
    <script src="motion-kit.js"></script>
    <script src="dual-screen-kit.js"></script>
    <script src="ui-icons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #8f0d12; --red-d: #4a0508; --gold: #d9a640; --gold-l: #ffe08a;
            --paper: #fffaf0; --paper-2: #f5e6c4; --ink: #4a1208; --muted: #8a5a35;
        }
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0214; font-family: 'Noto Sans TC', sans-serif; }
        .serif { font-family: 'Noto Serif TC', serif; }
        button { cursor: pointer; }

        /* ── 左：純淨 3D 主舞台 ── */
        #left-stage-pane { position: relative; background: #0d0214; overflow: hidden; }
        #canvas-container { position: absolute; inset: 0; cursor: grab; }
        .stage-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(5, 0, 10, .55) 100%); }

        /* ── 右：導覽與資訊視窗 ── */
        #right-info-pane {
            position: relative; overflow-y: auto; overflow-x: hidden; color: var(--ink);
            background:
                radial-gradient(circle at 85% 8%, rgba(255, 215, 0, .14), transparent 45%),
                radial-gradient(circle at 10% 92%, rgba(217, 28, 28, .2), transparent 50%),
                linear-gradient(160deg, #3d0508 0%, #5e0a10 45%, #2f0306 100%);
            border-left: 1px solid rgba(217, 166, 64, .55);
        }
        #right-info-pane::-webkit-scrollbar { width: 6px; }
        #right-info-pane::-webkit-scrollbar-thumb { background: #b98a2c; border-radius: 9px; }
        .info-scale { display: flex; flex-direction: column; gap: 10px; padding: 12px; min-height: 100%; }
        .ds-l-info .info-scale { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; max-width: 1320px; margin: 0 auto; padding: 18px; gap: 14px; }
        .ds-l-info .span-all { grid-column: 1 / -1; }
        .ds-l-float .info-scale { padding: 8px 10px 10px; }

        .info-head { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 14px; background: linear-gradient(180deg, #fff6dc, #f0d38c); border: 1px solid #f7dc8f; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }
        .badge { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 30% 30%, #d72222, #6b0000); color: #fff; font: 900 18px/1 'Noto Serif TC', serif; box-shadow: inset 0 0 0 2px #ffd166, 0 3px 8px rgba(0, 0, 0, .35); }
        .eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; color: #9a2a10; }
        .info-head h1 { margin: 1px 0 0; font: 900 19px/1.2 'Noto Serif TC', serif; color: #6e0808; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-btn { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--red); color: var(--gold-l); border: 1px solid #e9b949; font-size: 16px; }
        .icon-btn:hover { filter: brightness(1.15); }

        .toast-line { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 12px; background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 209, 102, .35); color: #ffe7a8; font-weight: 800; font-size: 13px; min-height: 34px; }
        .toast-line .ic { color: var(--gold-l); font-size: 15px; }
        .toast-pop { animation: toastPop 1.6s cubic-bezier(.22, 1, .36, 1); }
        @keyframes toastPop { 0% { transform: translateY(6px); opacity: .2; } 15% { transform: none; opacity: 1; background: rgba(143, 13, 13, .75); } 100% { background: rgba(0, 0, 0, .35); } }

        .card { background: linear-gradient(180deg, var(--paper), var(--paper-2)); border: 1px solid rgba(201, 138, 36, .6); border-radius: 14px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(20, 0, 0, .35); }
        .card-h { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-weight: 900; font-size: 13.5px; color: #690b0b; }
        .card-h .ic { color: #b5121b; font-size: 16px; }
        .card-h .r { margin-left: auto; display: flex; gap: 6px; align-items: center; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat { background: linear-gradient(150deg, #6b080d, #420306); color: #fff4d6; border-radius: 10px; padding: 7px 6px; text-align: center; border: 1px solid rgba(240, 188, 66, .6); }
        .stat small { display: block; font-size: 10.5px; color: #f5d08a; font-weight: 700; }
        .stat b { display: block; font: 900 22px/1.2 'Noto Serif TC', serif; color: #ffd700; white-space: nowrap; }
        .bar { height: 10px; background: #360505; border-radius: 99px; overflow: hidden; border: 1px solid #c98a24; padding: 1px; }
        .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #d91c1c, #ff8800, #ffd700, #fff5a8, #ffd700, #ff6200); background-size: 200% 100%; animation: shimmer 2.2s linear infinite; transition: width .18s; }
        @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
        .meter { display: grid; grid-template-columns: 18px 1fr 44px; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: #690b0b; }
        .meter .ic { font-size: 15px; color: #8f0d0d; }
        .meter .track { height: 7px; background: #eadcc0; border-radius: 9px; overflow: hidden; }
        .meter .track i { display: block; height: 100%; border-radius: 9px; transition: width .1s; }
        .meter span { text-align: right; font-variant-numeric: tabular-nums; }
        .muted { color: var(--muted); font-size: 11.5px; font-weight: 700; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 12.5px; border-radius: 10px; padding: 7px 10px; transition: transform .12s, filter .12s; white-space: nowrap; }
        .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px) scale(.98); }
        .btn .ic { font-size: 15px; }
        .btn-red { background: linear-gradient(180deg, #c81a1a, #7c0909); color: #fff6df; border: 1px solid #e9b949; }
        .btn-gold { background: linear-gradient(180deg, #ffe27a, #d99316); color: #5a0707; border: 1px solid #fff1b0; }
        .btn-ghost { background: rgba(143, 13, 13, .06); color: #6b0b0b; border: 1px solid rgba(143, 13, 13, .28); }
        .btn.on { background: linear-gradient(180deg, #ffe066, #d48b11); color: #540606; border-color: #fff6c2; box-shadow: 0 0 10px rgba(255, 215, 0, .7); }
        .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .grid5 .btn, .grid4 .btn { flex-direction: column; gap: 3px; padding: 7px 3px; font-size: 11.5px; }
        .grid5 .btn .ic, .grid4 .btn .ic { font-size: 18px; }

        .seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; background: rgba(143, 13, 13, .08); padding: 3px; border-radius: 11px; }
        .seg button { padding: 6px 2px; border-radius: 8px; font-weight: 800; font-size: 12px; color: #7a1a0a; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .seg button .ic { font-size: 16px; }
        .seg button.on { background: #8f0d0d; color: #ffe08a; }
        .seg button:not(.on):hover { background: rgba(143, 13, 13, .1); }
        .sensor-st { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #6b0b0b; }
        .sensor-st .dot { width: 8px; height: 8px; border-radius: 50%; background: #b6a27a; }
        .sensor-st .dot.on { background: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, .2); }
        .sensor-st .dot.warn { background: #f59e0b; }

        #webcam-box { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid #8f0d0d; }
        #webcam-canvas { width: 100%; height: 100%; display: block; }
        #webcam-hint { position: absolute; inset: auto 0 0 0; padding: 4px 6px; font-size: 11px; font-weight: 700; text-align: center; color: #ffe08a; background: linear-gradient(transparent, rgba(0, 0, 0, .8)); }

        .wave-pad { position: relative; height: 128px; border-radius: 12px; overflow: hidden; touch-action: none; cursor: crosshair; background: radial-gradient(circle at 50% 50%, #2e071d, #14020c); border: 1px solid #b98a2c; }
        .wave-pad canvas { width: 100%; height: 100%; display: block; }
        .wave-pad .hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: rgba(255, 224, 138, .4); font: 900 14px 'Noto Serif TC', serif; }
        .drum { width: 100%; height: 128px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #7a0808;
            background: radial-gradient(circle at 50% 42%, #fffdf5 0, #f5deb3 42%, #cfa055 62%, #8f0d0d 64%, #5c0606 100%); border: 1px solid #b98a2c; transition: transform .07s; }
        .drum .ic { font-size: 28px; }
        .drum b { font: 900 16px 'Noto Serif TC', serif; }
        .drum small { font-size: 10.5px; font-weight: 800; color: #5c0606; }
        .drum.hit { transform: scale(.94); box-shadow: 0 0 24px rgba(255, 215, 0, .9); }
        kbd { font: 700 10px ui-monospace, monospace; padding: 1px 4px; border: 1px solid #d9a74a; border-radius: 4px; background: #fff5d6; color: #690b0b; }

        .guide { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
        .g-row { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: 9px; font-size: 12px; color: #4a1208; border: 1px solid transparent; transition: background .3s; }
        .g-row .ic { font-size: 16px; color: #8f0d0d; flex: none; }
        .g-row b { font-weight: 900; color: #690b0b; white-space: nowrap; }
        .g-row span { color: var(--muted); font-size: 11px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .g-row .tx { min-width: 0; display: flex; flex-direction: column; }
        .g-row.adv b::after { content: '進階'; margin-left: 5px; padding: 0 5px; border-radius: 6px; font-size: 9.5px; background: #8f0d0d; color: #ffe08a; vertical-align: 1px; }
        .g-row.hit { background: #8f0d0d; border-color: #e9b949; }
        .g-row.hit b, .g-row.hit span, .g-row.hit .ic { color: #ffe08a; }
        .g-row.off { opacity: .35; }
        @media (max-width: 520px) { .guide { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="dual-workspace" class="w-full h-full flex flex-col lg:flex-row overflow-hidden">

        <!-- 左：純淨 3D 主舞台（無任何文字） -->
        <section id="left-stage-pane" class="w-full lg:w-[58%] h-[46%] lg:h-full shrink-0">
            <div id="canvas-container"></div>
            <div class="stage-vignette"></div>
        </section>

        <!-- 右：導覽與資訊視窗（可彈出到另一個螢幕、可調字體大小） -->
        <aside id="right-info-pane" class="w-full lg:w-[42%] h-[54%] lg:h-full">
            <div id="info-scale" class="info-scale">

                <header class="info-head span-all">
                    <div class="badge">07</div>
                    <div class="min-w-0">
                        <div class="eyebrow">體感互動・雙螢幕展演</div>
                        <h1>舞龍舞獅感應遊戲</h1>
                    </div>
                    <div id="ds-slot" class="ml-auto"></div>
                    <button id="btn-audio-toggle" class="icon-btn" title="鑼鼓音效開關"><i id="icon-audio" data-ic="volume"></i></button>
                </header>

                <div id="right-live-toast" class="toast-line span-all"><i data-ic="sparkle"></i><span id="toast-text">揮動雙手或踏步，帶動舞龍舞獅！</span></div>

                <!-- A. 即時數據 -->
                <section class="card">
                    <div class="card-h"><i data-ic="gauge"></i>即時展演數據</div>
                    <div class="stats">
                        <div class="stat"><small>喜氣總分</small><b id="ui-score">1,280</b></div>
                        <div class="stat"><small>協調連擊</small><b id="ui-combo">x1</b></div>
                        <div class="stat"><small>瑞兆評級</small><b id="ui-rank" style="font-size:17px">祥瑞初現</b></div>
                    </div>
                    <div class="flex items-center justify-between mt-3 mb-1 text-xs font-black text-[#730808]">
                        <span class="flex items-center gap-1"><i data-ic="flame"></i>團隊動作協調度</span>
                        <span id="ui-harmony-pct" class="text-sm">45%</span>
                    </div>
                    <div class="bar"><i id="ui-harmony-bar" style="width:45%"></i></div>
                    <div id="ui-harmony-hint" class="muted mt-1.5">同時揮動雙手＋踏步，協調度達 85% 會放滿天煙火</div>
                    <div class="space-y-1.5 mt-3">
                        <div class="meter"><i data-ic="hand"></i><div class="track"><i id="ui-left-wave-bar" style="width:32%;background:linear-gradient(90deg,#dc2626,#fbbf24)"></i></div><span id="ui-left-wave-text">32%</span></div>
                        <div class="meter"><i data-ic="hand" style="transform:scaleX(-1)"></i><div class="track"><i id="ui-right-wave-bar" style="width:32%;background:linear-gradient(90deg,#0284c7,#67e8f9)"></i></div><span id="ui-right-wave-text">32%</span></div>
                        <div class="meter"><i data-ic="step"></i><div class="track"><i id="ui-run-cadence-bar" style="width:10%;background:linear-gradient(90deg,#059669,#facc15)"></i></div><span id="ui-run-cadence-text">#4/7</span></div>
                    </div>
                </section>

                <!-- B. 體感偵測（分級） -->
                <section class="card">
                    <div class="card-h"><i data-ic="radar"></i>體感偵測
                        <div class="r">
                            <span class="sensor-st"><span id="sensor-dot" class="dot"></span><span id="sensor-text">未啟動</span></span>
                        </div>
                    </div>
                    <div id="tier-seg" class="seg mb-2">
                        <button data-tier="quick"><i data-ic="zap"></i>快速</button>
                        <button data-tier="hands"><i data-ic="hand"></i>手部</button>
                        <button data-tier="run"><i data-ic="run"></i>跑步</button>
                        <button data-tier="body"><i data-ic="users"></i>全身</button>
                        <button data-tier="advanced"><i data-ic="sparkle"></i>進階</button>
                    </div>
                    <div id="tier-desc" class="muted mb-2"></div>
                    <div class="flex gap-2 mb-2">
                        <button id="btn-webcam-toggle" class="btn btn-red flex-1"><i id="icon-cam" data-ic="camera"></i><span id="ui-webcam-btn-text">開啟鏡頭</span></button>
                        <button id="btn-webcam-recal" class="btn btn-ghost hidden" title="重新偵測與校正"><i data-ic="target"></i>校正</button>
                    </div>
                    <div id="webcam-box" class="hidden">
                        <video id="webcam-video" autoplay playsinline muted class="hidden"></video>
                        <canvas id="webcam-canvas"></canvas>
                        <div id="webcam-hint">請站到畫面中央</div>
                    </div>
                    <div id="sensor-remote" class="muted hidden">鏡頭在另一個視窗運作中</div>
                </section>

                <!-- C. 互動控制 -->
                <section class="card">
                    <div class="card-h"><i data-ic="wand"></i>互動控制<span class="r muted">滑動感應板控龍・戰鼓帶獅</span></div>
                    <div class="grid grid-cols-12 gap-2 mb-3">
                        <div id="right-wave-pad" class="wave-pad col-span-8"><canvas id="right-pad-canvas"></canvas><div class="hint">在此滑動揮舞光棒</div></div>
                        <button id="btn-tanggu-drum" class="drum col-span-4"><i data-ic="drum"></i><b>咚・跳樁</b><small><kbd>Space</kbd> / <kbd>A</kbd><kbd>D</kbd></small></button>
                    </div>
                    <div class="flex items-center justify-between mb-1.5 text-xs font-black text-[#690b0b]">
                        <span class="flex items-center gap-1"><i data-ic="video"></i>主舞台鏡頭</span>
                        <span id="ui-cam-label" class="muted">全景舞台</span>
                    </div>
                    <div class="grid5 mb-3">
                        <button data-cam="panorama" class="cam-btn btn btn-ghost on"><i data-ic="panorama"></i>全景</button>
                        <button data-cam="dragon" class="cam-btn btn btn-ghost"><i data-ic="dragon"></i>飛龍</button>
                        <button data-cam="lion" class="cam-btn btn btn-ghost"><i data-ic="paw"></i>瑞獅</button>
                        <button data-cam="sky" class="cam-btn btn btn-ghost"><i data-ic="moon"></i>煙火</button>
                        <button data-cam="orbit" class="cam-btn btn btn-ghost"><i data-ic="orbit"></i>環繞</button>
                    </div>
                    <div class="grid4">
                        <button data-stunt="dragon" class="btn btn-gold"><i data-ic="dragon"></i>祥龍 8 字</button>
                        <button data-stunt="lion" class="btn btn-gold"><i data-ic="paw"></i>高樁連跳</button>
                        <button data-stunt="lanterns" class="btn btn-gold"><i data-ic="lantern"></i>天燈金幣</button>
                        <button data-stunt="climax" class="btn btn-red"><i data-ic="burst"></i>龍獅齊舞</button>
                    </div>
                </section>

                <!-- D. 動作說明（依分級顯示，偵測到時會亮起） -->
                <section class="card">
                    <div class="card-h"><i data-ic="book"></i>動作與效果<span id="guide-tier" class="r muted"></span></div>
                    <div id="gesture-guide" class="guide"></div>
                </section>
            </div>
        </aside>
    </div>

    <script>
        /********************************************************************
         * 1. 音效（Web Audio 合成：大堂鼓、銅鈸、大鑼、煙火、歡呼）
         ********************************************************************/
        class FestiveAudioEngine {
            constructor() { this.ctx = null; this.enabled = true; this.lastDrum = 0; this.lastCymbal = 0; }
            init() {
                if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            toggle() { this.enabled = !this.enabled; if (this.enabled) this.init(); return this.enabled; }
            _ok() { if (!this.enabled) return false; this.init(); return !!this.ctx; }
            _noise(sec, decay) {
                const n = this.ctx.sampleRate * sec, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
                for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * decay));
                const s = this.ctx.createBufferSource(); s.buffer = b; return s;
            }
            playDrum(intensity = 1, pitch = 0) {
                if (!this._ok()) return; const now = this.ctx.currentTime; if (now - this.lastDrum < 0.065) return; this.lastDrum = now;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = 'triangle'; o.frequency.setValueAtTime(138 + pitch * 24, now); o.frequency.exponentialRampToValueAtTime(46, now + 0.23);
                g.gain.setValueAtTime(Math.min(0.65, 0.25 + intensity * 0.35), now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.27);
                o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + 0.28);
            }
            playCymbal(intensity = 0.8) {
                if (!this._ok()) return; const now = this.ctx.currentTime; if (now - this.lastCymbal < 0.14) return; this.lastCymbal = now;
                const s = this._noise(0.34, 0.1), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
                f.type = 'bandpass'; f.frequency.value = 5300; f.Q.value = 1.8;
                g.gain.setValueAtTime(Math.min(0.34, intensity * 0.28), now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.33);
                s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start(now);
            }
            playGong() {
                if (!this._ok()) return; const now = this.ctx.currentTime;
                [196, 294, 392, 523.25, 659.25].forEach((fq, i) => {
                    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                    o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.setValueAtTime(fq, now); o.frequency.exponentialRampToValueAtTime(fq * 0.96, now + 1.2);
                    g.gain.setValueAtTime(0.12 / (i + 1), now); g.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
                    o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + 1.3);
                });
                this.playCymbal(1);
            }
            playFireworkBurst() {
                if (!this.enabled || !this.ctx) return; const now = this.ctx.currentTime;
                const s = this._noise(0.21, 0.06), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
                f.type = 'lowpass'; f.frequency.value = 1600; g.gain.setValueAtTime(0.16, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start(now);
            }
            playChime() {

        function createLightWand(glowColor, ribbonColor) {
            const g = new THREE.Group();
            const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.75, 16), new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: 0.4, metalness: 0.5 })); g.add(handle);

            const halo = glowSprite(ribbonColor, 1.8, 0.9); halo.position.y = 0.45; g.add(halo);
            scene.add(g);
            const N = 40, pts = Array.from({ length: N }, () => new THREE.Vector3(0, 2, 9));
            const pos = new Float32Array(N * 2 * 3), col = new Float32Array(N * 2 * 3), idx = [];
            const c = new THREE.Color(ribbonColor);
            for (let i = 0; i < N; i++) { const f = Math.pow(1 - i / N, 1.6); for (let k = 0; k < 2; k++) col.set([c.r * f, c.g * f, c.b * f], (i * 2 + k) * 3); if (i < N - 1) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2); }
            const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.setIndex(idx);
            const ribbon = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
            ribbon.frustumCulled = false; scene.add(ribbon);
            return { group: g, tip, halo, pts, ribbon };
        }
        const leftWand = createLightWand(0xfff066, 0xffaa00), rightWand = createLightWand(0x66f0ff, 0x00b4ff);
        function updateRibbon(w, head) {
            w.pts.pop(); w.pts.unshift(head);
            const a = w.ribbon.geometry.attributes.position.array, N = w.pts.length;
            for (let i = 0; i < N; i++) {
                const p = w.pts[i], hw = 0.22 * (1 - i / N) + 0.02;
                a[i * 6] = p.x; a[i * 6 + 1] = p.y + hw; a[i * 6 + 2] = p.z;
                a[i * 6 + 3] = p.x; a[i * 6 + 4] = p.y - hw; a[i * 6 + 5] = p.z;
            }
            w.ribbon.geometry.attributes.position.needsUpdate = true;
        }

        const rockets = [], bursts = [];
        const FW_PALETTES = [[0xffd700, 0xfff1b0], [0xff2a2a, 0xffb36b], [0x00f5d4, 0xb4fff0], [0xff66c4, 0xffd1ec], [0xff9e00, 0xffe08a], [0x9b8cff, 0xe0d9ff]];
        function launchFirework(x, z, opts = {}) {
            const s = glowSprite(0xffe9b0, 0.7, 1); s.position.set(x, 0.5, z); scene.add(s);
            rockets.push({ s, vy: 13 + Math.random() * 4, y: opts.y || 8 + Math.random() * 5, opts, trailT: 0 });
        }
        function spawnFirework(x, y, z, count = 70, type) {
            type = type || ['sphere', 'sphere', 'ring', 'willow'][Math.floor(Math.random() * 4)];
            const pal = FW_PALETTES[Math.floor(Math.random() * FW_PALETTES.length)];
            const n = type === 'heart' ? Math.max(90, count) : count;
            const geo = new THREE.BufferGeometry(), pos = new Float32Array(n * 3), col = new Float32Array(n * 3), vel = [];
            const c1 = new THREE.Color(type === 'heart' ? 0xff3d7f : pal[0]), c2 = new THREE.Color(type === 'heart' ? 0xffc2d9 : pal[1]);
            const axis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
            for (let i = 0; i < n; i++) {
                pos.set([x, y, z], i * 3);
                const c = (i % 3 ? c1 : c2); col.set([c.r, c.g, c.b], i * 3);
                let v;
                if (type === 'heart') {
                    const t = i / n * Math.PI * 2, hx = 16 * Math.pow(Math.sin(t), 3), hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    v = new THREE.Vector3(hx / 16, hy / 16, (Math.random() - 0.5) * 0.15).multiplyScalar(6.5);
                } else if (type === 'ring') {
                    const t = i / n * Math.PI * 2; v = new THREE.Vector3(Math.cos(t), Math.sin(t), 0).applyAxisAngle(axis, 1.1).multiplyScalar(7);
                } else {
                    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1), sp = type === 'willow' ? 4 + Math.random() * 2 : 4 + Math.random() * 5;
                    v = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.sin(ph) * Math.sin(th), Math.cos(ph)).multiplyScalar(sp);
                }
                vel.push(v);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            const mat = new THREE.PointsMaterial({ map: glowTex, size: type === 'heart' ? 0.75 : 0.6, vertexColors: true, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending });
            const pts = new THREE.Points(geo, mat); scene.add(pts);
            bursts.push({ pts, vel, age: 0, max: type === 'willow' ? 2.6 : type === 'heart' ? 2.2 : 1.6, g: type === 'willow' ? 2.2 : type === 'heart' ? 0.8 : 3.4, drag: type === 'heart' ? 0.9 : 0.97 });
            flashLight.position.set(x, y, z); flashLight.color.copy(c1); flashLight.intensity = 3.2;
            audio.playFireworkBurst();
        }

        }

        /********************************************************************
         * 9. 遊戲動作（只在主控視窗執行）
         ********************************************************************/
        function triggerRunStep(intensity = 1.0) {
            gameState.runCadence = Math.min(1.0, gameState.runCadence + 0.32 * intensity);
            gameState.coordination = Math.min(100, gameState.coordination + 3.8);
            gameState.score += Math.round(25 * gameState.combo);
            audio.playDrum(intensity, (gameState.lionPoleIndex % 3) * 0.4);
            if (!gameState.lionIsJumping) {
                const cur = plumPoles[gameState.lionPoleIndex];
                gameState.lionPoleIndex = (gameState.lionPoleIndex + 1) % plumPoles.length;
                const next = plumPoles[gameState.lionPoleIndex];
                gameState.lionFromPos.set(cur.x, cur.y, cur.z); gameState.lionToPos.set(next.x, next.y, next.z);
                gameState.lionJumpProgress = 0; gameState.lionIsJumping = true; gameState.lionJumpHeight = 1.6 + Math.random() * 1.1;
                next.topMesh.material.emissive.setHex(0xff9900); setTimeout(() => next.topMesh.material.emissive.setHex(0x331f00), 350);
                if (gameState.lionPoleIndex === 4) { audio.playCymbal(0.9); notifyRightScreen('瑞獅躍上最高梅花樁！+150 喜氣'); gameState.score += 150; launchFirework(next.x, -6); }
            }
        }

        function handleDualBatonWave(normX, normY) {
            const dx = normX - (gameState.leftHand.x + 0.22), dy = normY - gameState.leftHand.y, speed = Math.hypot(dx, dy);
            gameState.leftHand.x = Math.max(-1, Math.min(1, normX - 0.22)); gameState.leftHand.y = Math.max(-1, Math.min(1, normY));
            gameState.rightHand.x = Math.max(-1, Math.min(1, normX + 0.22)); gameState.rightHand.y = Math.max(-1, Math.min(1, normY + Math.sin(performance.now() * 0.008) * 0.12));
            if (speed > 0.012) {
                gameState.leftHand.energy = Math.min(1, gameState.leftHand.energy + speed * 1.1);
                gameState.rightHand.energy = Math.min(1, gameState.rightHand.energy + speed * 1.1);
                gameState.waveEnergy = Math.min(1, gameState.waveEnergy + speed * 0.9);
                gameState.coordination = Math.min(100, gameState.coordination + speed * 4.2);
                gameState.score += Math.round(speed * 16 * gameState.combo);
                if (speed > 0.18 && Math.random() < 0.28) audio.playCymbal(Math.min(1, speed * 2));
            }
        }

        // 鏡頭偵測到的雙手位置（任一視窗送來）
        function applyCameraHands(d) {
            const set = (h, hand) => {
                if (!h) return false;
                hand.x += (h.x - hand.x) * 0.45; hand.y += (h.y - hand.y) * 0.45;
                if (h.e > 0.08) hand.energy = Math.min(1, hand.energy + h.e * 0.16);
                return h.e > 0.15;
            };
            const l = set(d.l, gameState.leftHand), r = set(d.r, gameState.rightHand);
            if (l || r) {
                gameState.waveEnergy = Math.min(1, gameState.waveEnergy + 0.12 * Math.max(d.l ? d.l.e : 0, d.r ? d.r.e : 0));
                gameState.coordination = Math.min(100, gameState.coordination + (l && r ? 0.6 : 0.3));
            }
        }

        function setCameraDirectorMode(mode, quiet) {
            if (!CAM_LABELS[mode]) return;
            gameState.cameraMode = mode;
            if (!quiet) notifyRightScreen('主舞台鏡頭：' + CAM_LABELS[mode]);
        }

        function executeShowstopperStunt(stunt) {
            if (stunt === 'dragon') {
                gameState.autoMoveMode = 'figure8'; gameState.autoMoveTimer = 4.5; gameState.coordination = Math.min(100, gameState.coordination + 18);
                audio.playGong(); notifyRightScreen('祥龍獻瑞・雙龍戲珠 8 字大迴旋！');
            } else if (stunt === 'lion') {
                gameState.autoMoveMode = 'lionJump'; gameState.autoMoveTimer = 4.0; gameState.coordination = Math.min(100, gameState.coordination + 18);
                triggerRunStep(1.2); notifyRightScreen('醒獅採青・飛躍梅花樁連跳！');
            } else if (stunt === 'lanterns') {
                gameState.coordination = Math.min(100, gameState.coordination + 20); gameState.score += 260;
                spawnSkyLanternsAndCoins(); notifyRightScreen('祈福天燈冉冉升空・天降金幣雨！');
            } else if (stunt === 'climax') {
                gameState.autoMoveMode = 'climax'; gameState.autoMoveTimer = 6.0; gameState.coordination = 100;
                gameState.combo = Math.min(9, gameState.combo + 1); gameState.shake = 0.6;
                audio.playGong(); spawnSkyLanternsAndCoins();
                for (let i = 0; i < 6; i++) setTimeout(() => launchFirework((Math.random() - 0.5) * 18, -5 - Math.random() * 6), i * 240);
                notifyRightScreen('龍獅齊舞大招全開！協調度 100%！');
            }
        }

        // 體感動作 → 遊戲效果（快速/手部/跑步/全身/進階 共用同一張對應表）
        const ACTIONS = [
            { g: ['step', 'highKnee'], ic: 'step', t: '原地踏步', e: '瑞獅跳上梅花樁', tiers: ['quick', 'run', 'body', 'advanced'] },
            { g: ['run'], ic: 'run', t: '快速跑步', e: '瑞獅連跳加速', tiers: ['quick', 'run', 'body', 'advanced'] },
            { g: ['jump'], ic: 'up', t: '跳躍', e: '瑞獅騰空飛躍', tiers: ['quick', 'run', 'body', 'advanced'] },
            { g: ['wave', 'swipe'], ic: 'hand', t: '揮動雙手', e: '金龍跟著光棒飛舞', tiers: ['quick', 'hands', 'body', 'advanced'] },
            { g: ['clap'], ic: 'sparkle', t: '拍手', e: '鈸聲齊鳴、協調度上升', tiers: ['quick', 'hands', 'body', 'advanced'] },
            { g: ['handsUp'], ic: 'lantern', t: '雙手高舉', e: '祈福天燈與金幣雨', tiers: ['quick', 'hands', 'body', 'advanced'] },
            { g: ['heart'], ic: 'heart', t: '頭上比愛心', e: '愛心煙火', tiers: ['quick', 'hands', 'body', 'advanced'] },
            { g: ['armsWide', 'yPose'], ic: 'dragon', t: '張開雙臂／Y 字', e: '祥龍 8 字大迴旋', tiers: ['quick', 'hands', 'body', 'advanced'] },
            { g: ['cross'], ic: 'paw', t: '雙手胸前交叉', e: '醒獅高樁連跳', tiers: ['hands', 'body', 'advanced'] },
            { g: ['raiseHand'], ic: 'video', t: '單手舉高', e: '切換舞台鏡頭', tiers: ['quick', 'hands', 'body', 'advanced'] },
            { g: ['squat'], ic: 'burst', t: '蹲下再站起', e: '地面煙火', tiers: ['quick', 'run', 'body', 'advanced'] },
            { g: ['bow'], ic: 'users', t: '鞠躬', e: '謝幕鑼聲、觀眾歡呼', tiers: ['hands', 'body', 'advanced'] },
            { g: ['thumbsUp'], ic: 'star', t: '比讚 👍', e: '觀眾喝采 +200', tiers: ['advanced'], adv: true },
            { g: ['victory'], ic: 'burst', t: '比 YA ✌', e: '施放一發煙火', tiers: ['advanced'], adv: true },
            { g: ['heartHands', 'fingerHeart'], ic: 'heart', t: '雙手比心／手指愛心', e: '三連愛心煙火', tiers: ['advanced'], adv: true },
            { g: ['love'], ic: 'flame', t: '我愛你 🤟', e: '龍獅齊舞大招', tiers: ['advanced'], adv: true },
            { g: ['mouthOpen'], ic: 'smile', t: '張大嘴巴', e: '金龍吐火珠', tiers: ['advanced'], adv: true }
        ];
        let lastStuntAt = -1e9;
        function stuntByPose(stunt, label) {
            const t = performance.now(); if (t - lastStuntAt < 7000) return false; // 大招冷卻，避免連續誤觸
            lastStuntAt = t; notifyRightScreen(label + '・觸發特技！'); executeShowstopperStunt(stunt); return true;
        }
        function onGesture(name, d) {
            d = d || {};
            gameState.lastGesture = { seq: gameState.lastGesture.seq + 1, name };
            switch (name) {
                case 'step': triggerRunStep(d.source === 'motion' ? 0.65 : Math.min(1, 0.6 + (d.power || 0.3) * 2)); break;
                case 'highKnee': triggerRunStep(1.0); break;
                case 'jump': triggerRunStep(1.2); notifyRightScreen('偵測到跳躍！瑞獅騰空飛躍'); break;
                case 'run': gameState.runCadence = 1; gameState.coordination = Math.min(100, gameState.coordination + 8); notifyRightScreen('奔跑中！瑞獅連跳加速'); break;
                case 'wave': case 'swipe': gameState.waveEnergy = Math.min(1, gameState.waveEnergy + 0.25); gameState.coordination = Math.min(100, gameState.coordination + 2); break;
                case 'clap': audio.playCymbal(0.9); gameState.coordination = Math.min(100, gameState.coordination + 10); gameState.score += Math.round(60 * gameState.combo); notifyRightScreen('擊掌！鈸聲齊鳴'); break;
                case 'handsUp': stuntByPose('lanterns', '雙手高舉'); break;
                case 'armsWide': case 'yPose': stuntByPose('dragon', name === 'yPose' ? 'Y 字歡呼' : '張開雙臂'); break;
                case 'cross': stuntByPose('lion', '雙手交叉'); break;
                case 'love': stuntByPose('climax', '我愛你手勢'); break;
                case 'heart': case 'heartHands': case 'fingerHeart':
                    if (performance.now() - (onGesture.heartT || 0) > 3500) { onGesture.heartT = performance.now(); heartFireworks(); audio.playChime(); gameState.score += 300; gameState.coordination = Math.min(100, gameState.coordination + 15); notifyRightScreen('收到你的愛心！愛心煙火綻放 +300'); }
                    break;
                case 'raiseHand': { const i = CAM_ORDER.indexOf(gameState.cameraMode), n = d.side === 'left' ? (i + CAM_ORDER.length - 1) % CAM_ORDER.length : (i + 1) % CAM_ORDER.length; setCameraDirectorMode(CAM_ORDER[n]); break; }
                case 'squat': launchFirework((Math.random() - 0.5) * 10, -4); break;
                case 'bow': audio.playGong(); audio.playCheer(); gameState.score += 120; notifyRightScreen('謝謝鞠躬！觀眾熱烈歡呼'); break;
                case 'thumbsUp': audio.playCheer(); gameState.score += 200; gameState.coordination = Math.min(100, gameState.coordination + 8); notifyRightScreen('讚！觀眾喝采 +200'); break;
                case 'victory': launchFirework((Math.random() - 0.5) * 14, -6, { y: 10 }); gameState.score += 80; break;
                case 'mouthOpen': spawnFirework(pearlGroup.position.x, pearlGroup.position.y, pearlGroup.position.z, 50, 'sphere'); notifyRightScreen('金龍吐出火珠！'); break;
            }
        }

        /********************************************************************
         * 10. 雙視窗：主控端執行指令、送出快照；資訊視窗鏡像顯示
         ********************************************************************/
        const ds = DualScreen.create({
            app: 'dragon-lion-07', title: '舞龍舞獅',
            stage: '#left-stage-pane', info: '#right-info-pane', scale: '#info-scale',
            toolbar: { mount: '#ds-slot', corner: 'tr' }, accent: '#ffd166',
            labels: { stage: '3D 主舞台', info: '資訊視窗' },
            onLayout: () => { resizeStageRenderer(); resizeRightWavePad(); },
            snapshot: () => ({
                lh: gameState.leftHand, rh: gameState.rightHand, w: gameState.waveEnergy, run: gameState.runCadence,
                co: gameState.coordination, sc: gameState.score, cb: gameState.combo, pole: gameState.lionPoleIndex,
                cam: gameState.cameraMode, toast: gameState.toast, lg: gameState.lastGesture, sensor: gameState.sensor
            }),
            apply: s => {
                Object.assign(gameState.leftHand, s.lh); Object.assign(gameState.rightHand, s.rh);
                gameState.waveEnergy = s.w; gameState.runCadence = s.run; gameState.coordination = s.co; gameState.score = s.sc; gameState.combo = s.cb;
                gameState.lionPoleIndex = s.pole; gameState.cameraMode = s.cam;
                if (s.toast && s.toast.seq !== gameState.toast.seq) { gameState.toast = s.toast; showToast(s.toast.msg); }
                if (s.lg) gameState.lastGesture = s.lg;
                if (s.sensor && !kitRunningHere()) gameState.sensor = s.sensor;
            }
        });
        ds.handle('step', d => triggerRunStep(d.i || 1));
        ds.handle('wave', d => handleDualBatonWave(d.x, d.y));
        ds.handle('hands', d => applyCameraHands(d));
        ds.handle('stunt', d => executeShowstopperStunt(d.stunt));
        ds.handle('camera', d => setCameraDirectorMode(d.mode));
        ds.handle('sensor', d => { gameState.sensor = d; });
        ds.handle('audio', d => { audio.enabled = !!d.on; if (audio.enabled) audio.init(); });

        /********************************************************************
         * 11. 鏡頭體感（MotionKit 分級）：偵測在哪個視窗都可以，動作交給主控端
         ********************************************************************/
        const videoEl = document.getElementById('webcam-video');
        const camCanvas = document.getElementById('webcam-canvas');
        camCanvas.width = 400; camCanvas.height = 300;
        let motionKit = null, kitOn = false;
        let tier = (() => { try { return localStorage.getItem('dragon-lion-07.tier') || 'quick'; } catch (_) { return 'quick'; } })();
        const kitRunningHere = () => kitOn;
        const TIER_HINT = {
            quick: '展場用：免校正、人一站上就開始，離開 30 秒自動重置分數',
            hands: '只看上半身：適合坐著玩或空間較小',
            run: '下半身為主：踏步、跑步、跳躍、蹲下',
            body: '全身動作：開啟時會跑一次自動校正',
            advanced: '全身＋手指手勢（讚、YA、比心…），需要較好的電腦'
        };

        function pushSensor(patch) {
            Object.assign(gameState.sensor, patch, { tier });
            ds.command('sensor', Object.assign({}, gameState.sensor));
        }
        function initMotionKit() {
            if (motionKit) return true;
            if (!window.MotionKit) return false;
            motionKit = MotionKit.create({
                id: 'dragon-lion-dance', preset: tier, title: '舞龍舞獅 · 體感鏡頭',
                video: videoEl, canvas: camCanvas, lanes: 1, debug: false
            });
            motionKit.on('gesture', e => { if (e.name !== 'motion' && e.name !== 'presence' && e.name !== 'idle') ds.command('gesture', { name: e.name, data: e.data }); });
            let lastHands = 0;
            motionKit.on('frame', f => {
                if (!f || !f.tracking || !f.hands) return;
                const t = performance.now(); if (t - lastHands < 33) return; lastHands = t;
                const pose = f.backend !== 'motion';
                const pack = h => h && h.tracked ? { x: Math.max(-1, Math.min(1, h.rx * (pose ? 1.25 : 1))), y: Math.max(-1, Math.min(1, h.ry + (pose ? 0.5 : 0))), e: h.energy } : null;
                ds.command('hands', { l: pack(f.hands.left), r: pack(f.hands.right) });
            });
            motionKit.on('motion', e => pushSensor({ motion: e.state }));
            motionKit.on('presence', e => {
                pushSensor({ status: e.present ? '偵測中' : '等待玩家…' });
                document.getElementById('webcam-hint').textContent = e.present ? '開始動作吧！' : '請站到畫面中央';
                if (e.present && tier === 'quick') notifyLocal('歡迎！揮手、踏步或在頭上比愛心');
            });
            motionKit.on('idle', () => { if (tier === 'quick') { ds.command('gesture', { name: 'reset' }); } });
            motionKit.on('backend', e => { if (e.backend === 'motion') pushSensor({ status: '動態偵測（無骨架）' }); else pushSensor({ status: e.backend === 'pose' ? '骨架偵測' : '骨架＋手勢' }); });
            motionKit.on('camera', e => pushSensor({ status: e.status === 'lost' ? '鏡頭中斷，重新連線…' : '偵測中' }));
            return true;
        }
        ds.handle('gesture', d => { if (d.name === 'reset') { gameState.score = 1280; gameState.combo = 1; gameState.coordination = 45; notifyRightScreen('等待下一位玩家…'); } else onGesture(d.name, d.data); });
        function notifyLocal(msg) { if (ds.isAuthority) notifyRightScreen(msg); else showToast(msg); }

        function renderSensorUI() {
            const s = gameState.sensor, dot = document.getElementById('sensor-dot');
            dot.className = 'dot' + (s.on ? (/中斷|等待|動態/.test(s.status) ? ' warn' : ' on') : '');
            const mot = { idle: '', walk: '・走路', jog: '・慢跑', run: '・跑步', sprint: '・衝刺' }[s.motion] || '';
            setText('sensor-text', s.on ? s.status + mot : '未啟動');
            document.getElementById('webcam-box').classList.toggle('hidden', !kitOn);
            document.getElementById('sensor-remote').classList.toggle('hidden', kitOn || !s.on);
            document.getElementById('btn-webcam-recal').classList.toggle('hidden', !kitOn);
            setText('ui-webcam-btn-text', kitOn ? '關閉鏡頭' : '開啟鏡頭');
            const ic = document.getElementById('icon-cam'); if (ic.dataset.ic !== (kitOn ? 'cameraOff' : 'camera')) ic.dataset.ic = kitOn ? 'cameraOff' : 'camera';
        }

        async function toggleWebcamSensor() {
            if (kitOn) { motionKit.stop(); kitOn = false; pushSensor({ on: false, status: '未啟動' }); notifyLocal('已關閉鏡頭，可用感應板與戰鼓操作'); return; }
            if (!initMotionKit()) { notifyLocal('找不到 motion-kit.js（請與本檔放在同一資料夾）'); return; }
            kitOn = true; pushSensor({ on: true, status: '啟動中…' });
            const res = await motionKit.start();
            if (!res.ok) { kitOn = false; pushSensor({ on: false, status: '未啟動' }); notifyLocal((res.message || '無法開啟相機') + '，可用感應板與戰鼓操作'); return; }
            pushSensor({ on: true, status: res.backend === 'motion' ? '動態偵測（無骨架）' : '偵測中' });
            const q = res.quality;
            notifyLocal('鏡頭已就緒' + (q ? '（' + q.label + '・' + q.score + ' 分）' : '') + '，' + MotionKit.PRESETS[tier].label + '模式');
            if (ds.isAuthority) audio.playGong();
        }

        async function setTier(t) {
            tier = t; try { localStorage.setItem('dragon-lion-07.tier', t); } catch (_) { }
            document.querySelectorAll('#tier-seg button').forEach(b => b.classList.toggle('on', b.dataset.tier === t));
            document.getElementById('tier-desc').textContent = TIER_HINT[t];
            renderGuide();
            if (motionKit) { await motionKit.setPreset(t); pushSensor({}); if (kitOn) notifyLocal('偵測分級：' + MotionKit.PRESETS[t].label); }
        }

        function renderGuide() {
            document.getElementById('guide-tier').textContent = (window.MotionKit ? MotionKit.PRESETS[tier].label : tier) + '可用';
            document.getElementById('gesture-guide').innerHTML = ACTIONS.map((a, i) =>
                '<div class="g-row' + (a.adv ? ' adv' : '') + (a.tiers.includes(tier) ? '' : ' off') + '" data-i="' + i + '"><i data-ic="' + a.ic + '"></i><div class="tx"><b>' + a.t + '</b><span>' + a.e + '</span></div></div>').join('');
        }
        let shownGestureSeq = 0;
        function flashGuide() {
            const lg = gameState.lastGesture; if (lg.seq === shownGestureSeq) return; shownGestureSeq = lg.seq;
            const i = ACTIONS.findIndex(a => a.g.includes(lg.name)); if (i < 0) return;
            const row = document.querySelector('.g-row[data-i="' + i + '"]'); if (!row) return;
            row.classList.add('hit'); clearTimeout(row._t); row._t = setTimeout(() => row.classList.remove('hit'), 1200);
        }

        /********************************************************************
         * 12. 感應板、戰鼓、鍵盤、搖晃手機
         ********************************************************************/
        const padCanvas = document.getElementById('right-pad-canvas'), padCtx = padCanvas.getContext('2d'), padParticles = [];
        function resizeRightWavePad() { const r = padCanvas.parentElement.getBoundingClientRect(); if (r.width > 0 && r.height > 0) { padCanvas.width = r.width; padCanvas.height = r.height; } }
        let lastPadSend = 0;
        function handleWavePadInput(cx, cy) {
            const r = padCanvas.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
            padParticles.push({ x: x - 14, y, color: '#ffd700', life: 1 }, { x: x + 14, y, color: '#00e5ff', life: 1 });
            const t = performance.now(); if (t - lastPadSend < 16) return; lastPadSend = t;
            ds.command('wave', { x: (x / Math.max(1, r.width)) * 2 - 1, y: -((y / Math.max(1, r.height)) * 2 - 1) });
        }
        padCanvas.addEventListener('pointermove', e => handleWavePadInput(e.clientX, e.clientY));
        padCanvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length) handleWavePadInput(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
        stagePane.addEventListener('pointermove', e => {
            if (ds.layout !== 'split' && ds.layout !== 'stage' && ds.layout !== 'float') return;
            const r = stagePane.getBoundingClientRect();
            ds.command('wave', { x: ((e.clientX - r.left) / Math.max(1, r.width)) * 2 - 1, y: -(((e.clientY - r.top) / Math.max(1, r.height)) * 2 - 1) });
        });

        function renderWavePadParticles() {
            if (!padCanvas.width) return;
            padCtx.fillStyle = 'rgba(20, 2, 12, 0.22)'; padCtx.fillRect(0, 0, padCanvas.width, padCanvas.height);
            const W = padCanvas.width, H = padCanvas.height;
            [[gameState.leftHand, '#ffd700'], [gameState.rightHand, '#00e5ff']].forEach(([h, c]) => { padCtx.beginPath(); padCtx.arc((h.x * 0.5 + 0.5) * W, (-h.y * 0.5 + 0.5) * H, 6, 0, 6.3); padCtx.fillStyle = c; padCtx.fill(); });
            for (let i = padParticles.length - 1; i >= 0; i--) {
                const p = padParticles[i]; p.life -= 0.05; if (p.life <= 0) { padParticles.splice(i, 1); continue; }
                padCtx.beginPath(); padCtx.arc(p.x, p.y, 7 * p.life, 0, 6.3); padCtx.fillStyle = p.color; padCtx.fill();
            }
        }

        const drumBtn = document.getElementById('btn-tanggu-drum');
        function hitDrum(i) { drumBtn.classList.add('hit'); setTimeout(() => drumBtn.classList.remove('hit'), 90); audio.init(); ds.command('step', { i }); }
        drumBtn.addEventListener('click', () => hitDrum(1.15));
        document.querySelectorAll('.cam-btn').forEach(b => b.addEventListener('click', () => ds.command('camera', { mode: b.dataset.cam })));
        document.querySelectorAll('[data-stunt]').forEach(b => b.addEventListener('click', () => { audio.init(); ds.command('stunt', { stunt: b.dataset.stunt }); }));
        document.querySelectorAll('#tier-seg button').forEach(b => b.addEventListener('click', () => setTier(b.dataset.tier)));
        document.getElementById('btn-webcam-toggle').addEventListener('click', () => { audio.init(); toggleWebcamSensor(); });
        document.getElementById('btn-webcam-recal').addEventListener('click', () => { if (motionKit && motionKit.running) motionKit.recalibrate(); });
        document.getElementById('btn-audio-toggle').addEventListener('click', () => {
            const on = audio.toggle(); ds.command('audio', { on });
            document.getElementById('icon-audio').dataset.ic = on ? 'volume' : 'mute';
            notifyLocal(on ? '鑼鼓音效已開啟' : '舞台音效已靜音');
        });
        window.addEventListener('keydown', e => {
            if (e.altKey || e.ctrlKey || e.metaKey) return;
            if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'KeyA', 'KeyD', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) hitDrum(1.0); }
            else if (e.code === 'KeyH' && !e.repeat) ds.command('gesture', { name: 'heart' });
        });
        window.addEventListener('devicemotion', e => { const a = e.accelerationIncludingGravity; if (a && Math.hypot(a.x || 0, a.y || 0, a.z || 0) > 16) ds.command('step', { i: 0.85 }); });

        /********************************************************************
         * 13. 資訊視窗更新（只寫入有變的值）
         ********************************************************************/
        const _tc = {};
        function setText(id, v) { if (_tc[id] === v) return; _tc[id] = v; const el = document.getElementById(id); if (el) el.textContent = v; }
        function setWidth(id, v) { const k = id + ':w'; if (_tc[k] === v) return; _tc[k] = v; document.getElementById(id).style.width = v; }
        function updateRightInfoDashboard() {
            const coord = Math.round(gameState.coordination);
            setText('ui-harmony-pct', coord + '%'); setWidth('ui-harmony-bar', coord + '%');
            let rank, hint;
            if (coord >= 85) { rank = '普天同慶'; hint = '最高瑞兆！左舞台漫天煙火全開中'; }
            else if (coord >= 65) { rank = '飛龍在天'; hint = '默契絕佳！再加把勁衝上 85%'; }
            else if (coord >= 45) { rank = '雙獅獻瑞'; hint = '同時揮動雙手＋踏步，協調度達 85% 會放滿天煙火'; }
            else { rank = '祥瑞初現'; hint = '揮手、踏步或比愛心，讓舞台熱鬧起來'; }
            setText('ui-rank', rank); setText('ui-harmony-hint', hint);
            setText('ui-score', gameState.score.toLocaleString()); setText('ui-combo', 'x' + gameState.combo);
            const lp = Math.round(gameState.leftHand.energy * 100), rp = Math.round(gameState.rightHand.energy * 100), run = Math.round(gameState.runCadence * 100);
            setText('ui-left-wave-text', lp + '%'); setWidth('ui-left-wave-bar', Math.max(6, lp) + '%');
            setText('ui-right-wave-text', rp + '%'); setWidth('ui-right-wave-bar', Math.max(6, rp) + '%');
            setText('ui-run-cadence-text', '#' + (gameState.lionPoleIndex + 1) + '/7'); setWidth('ui-run-cadence-bar', Math.max(6, run) + '%');
            setText('ui-cam-label', CAM_LABELS[gameState.cameraMode]);
            if (_tc.cam !== gameState.cameraMode) { _tc.cam = gameState.cameraMode; document.querySelectorAll('.cam-btn').forEach(b => b.classList.toggle('on', b.dataset.cam === gameState.cameraMode)); }
            renderSensorUI(); flashGuide();
        }
        function updateCombo() {
            const c = gameState.coordination;
            gameState.combo = c >= 85 ? Math.max(5, gameState.combo) : c >= 65 ? Math.max(3, Math.min(gameState.combo, 4)) : c >= 45 ? 2 : 1;
        }

        /********************************************************************
         * 14. 主迴圈
         ********************************************************************/
        const clock = new THREE.Clock();
        let fireworkTimer = 0, autoStepAccum = 0;
        const _v = new THREE.Vector3(), _v2 = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1), elapsed = clock.getElapsedTime();
            const auth = ds.isAuthority;

            if (auth) simulate(dt, elapsed);
            if (ds.hasStage) renderStage(dt, elapsed);
            if (ds.hasInfo) { renderWavePadParticles(); updateRightInfoDashboard(); }
        }

        function simulate(dt, elapsed) {
            if (gameState.autoMoveMode) {
                gameState.autoMoveTimer -= dt;
                if (gameState.autoMoveMode === 'figure8' || gameState.autoMoveMode === 'climax') {
                    const sp = 3.6;
                    Object.assign(gameState.leftHand, { x: Math.sin(elapsed * sp) * 0.75 - 0.15, y: Math.sin(elapsed * sp * 2) * 0.45 + 0.15, energy: 0.95 });
                    Object.assign(gameState.rightHand, { x: Math.sin(elapsed * sp + 0.6) * 0.75 + 0.15, y: Math.cos(elapsed * sp * 2) * 0.45 + 0.15, energy: 0.95 });
                    gameState.waveEnergy = 0.95;
                }
                if (gameState.autoMoveMode === 'lionJump' || gameState.autoMoveMode === 'climax') { autoStepAccum += dt; if (autoStepAccum > 0.38) { autoStepAccum = 0; triggerRunStep(0.9); } }
                if (gameState.autoMoveTimer <= 0) gameState.autoMoveMode = null;
            }
            gameState.leftHand.energy = Math.max(0.16, gameState.leftHand.energy - dt * 0.45);
            gameState.rightHand.energy = Math.max(0.16, gameState.rightHand.energy - dt * 0.45);
            gameState.waveEnergy = Math.max(0.16, gameState.waveEnergy - dt * 0.35);
            gameState.runCadence = Math.max(0, gameState.runCadence - dt * 0.45);
            gameState.coordination = Math.max(28, gameState.coordination - dt * 2.0);
            updateCombo();

            if (ds.hasStage) {
                fireworkTimer += dt;
                const iv = gameState.coordination >= 80 ? 0.6 : gameState.coordination >= 50 ? 1.4 : 2.9;
                if (fireworkTimer >= iv) { fireworkTimer = 0; launchFirework((Math.random() - 0.5) * 22, -6 - Math.random() * 6, { y: 8 + Math.random() * 5 }); }
            }
        }

        function renderStage(dt, elapsed) {
            const G = gameState;
            // 光棒與彩帶
            leftWand.group.position.lerp(_v.set(G.leftHand.x * 6.5, 2.6 + G.leftHand.y * 3.2, 8.2), 0.25);
            leftWand.group.rotation.z = -G.leftHand.x * 0.6;
            rightWand.group.position.lerp(_v.set(G.rightHand.x * 6.5, 2.6 + G.rightHand.y * 3.2, 8.2), 0.25);
            rightWand.group.rotation.z = -G.rightHand.x * 0.6;
            [leftWand, rightWand].forEach((w, i) => {
                w.group.updateMatrixWorld();
                updateRibbon(w, new THREE.Vector3(0, 0.45, 0).applyMatrix4(w.group.matrixWorld));
                w.halo.scale.setScalar(1.4 + (i ? G.rightHand.energy : G.leftHand.energy) * 1.6);
            });

            // 金龍與龍珠
            const mx = (G.leftHand.x + G.rightHand.x) * 0.5, my = (G.leftHand.y + G.rightHand.y) * 0.5;
            const boost = 1 + G.waveEnergy * 0.8 + G.runCadence * 0.6;
            G.dragonTarget.set(-2.2 + mx * 9.5 + Math.cos(elapsed * 2.2 * boost) * 2.6, Math.max(1.8, 4.6 + my * 3.4 + Math.sin(elapsed * 3.1 * boost) * 1.4), -1.2 + Math.sin(elapsed * 1.8) * 2.4);
            pearlGroup.position.lerp(G.dragonTarget, 0.14);
            pearlGroup.rotation.y += dt * 3.5;
            pearlHalo.scale.setScalar(3.2 + Math.sin(elapsed * 8) * 0.5);
            pearlSparks.forEach((s, i) => { const a = elapsed * 3 + i * 1.05; s.position.set(Math.cos(a) * 0.95, Math.sin(a * 1.3) * 0.4, Math.sin(a) * 0.95); });
            const headPos = dragonPathHistory[0].clone().lerp(pearlGroup.position, 0.22);
            dragonPathHistory.unshift(headPos); if (dragonPathHistory.length > HISTORY_LENGTH) dragonPathHistory.pop();
            for (let i = 0; i < NUM_DRAGON_SEGMENTS; i++) {
                const hi = Math.min(i * 3 + 2, dragonPathHistory.length - 1), seg = dragonSegments[i];
                seg.position.copy(dragonPathHistory[hi]);
                seg.position.y += Math.sin(elapsed * 6 - i * 0.55) * 0.12 * boost;
                seg.lookAt(dragonPathHistory[Math.max(0, hi - 3)]);
                if (seg.userData.legs) seg.userData.legs.forEach((l, k) => { l.rotation.x = Math.sin(elapsed * 7 + k * Math.PI) * 0.5; });
            }
            if (dragonHead.userData.jaw) dragonHead.userData.jaw.rotation.x = 0.25 + Math.sin(elapsed * 7) * 0.18;

            // 瑞獅
            if (G.lionIsJumping) {
                G.lionJumpProgress += dt * (2.6 + G.runCadence * 1.8);
                if (G.lionJumpProgress >= 1) { G.lionJumpProgress = 1; G.lionIsJumping = false; spawnFirework(G.lionToPos.x, G.lionToPos.y + 0.3, G.lionToPos.z, 22, 'sphere'); }
                const p = G.lionJumpProgress;
                lion.position.lerpVectors(G.lionFromPos, G.lionToPos, p); lion.position.y += Math.sin(p * Math.PI) * G.lionJumpHeight;
                const lt = G.lionToPos.clone(); lt.y = lion.position.y; lion.lookAt(lt);
                lion.userData.head.rotation.x = -Math.sin(p * Math.PI) * 0.45;
            } else {
                const pole = plumPoles[G.lionPoleIndex];
                if (!ds.isAuthority) lion.position.set(pole.x, lion.position.y, pole.z);
                lion.position.y = pole.y + Math.abs(Math.sin(elapsed * (5.5 + G.waveEnergy * 5))) * (0.18 + G.waveEnergy * 0.22);
                lion.rotation.y += (-0.35 - lion.rotation.y) * 0.08;
                lion.userData.head.rotation.z = Math.sin(elapsed * 4.5) * 0.16; lion.userData.head.rotation.x = Math.sin(elapsed * 3.2) * 0.12;
            }
            const H = lion.userData.head.userData;
            H.leftEar.rotation.z = 0.35 + Math.sin(elapsed * 10) * 0.2; H.rightEar.rotation.z = -0.35 - Math.sin(elapsed * 10) * 0.2;
            lion.userData.tail.position.x = Math.sin(elapsed * 12) * 0.15;
            lion.userData.legs.forEach((l, i) => { l.rotation.x = Math.sin(elapsed * 9 + i * Math.PI * 0.5) * (G.lionIsJumping ? 0.55 : 0.18); });

            // 燈籠、觀眾、聚光燈、金箔、舞台燈泡
            lanterns.forEach(l => { l.group.position.y = l.baseY + Math.sin(elapsed * 2 + l.phase) * 0.15; l.group.rotation.z = Math.sin(elapsed * 1.5 + l.phase) * 0.08; l.halo.material.opacity = 0.45 + Math.sin(elapsed * 9 + l.phase * 3) * 0.06 + Math.random() * 0.04; });
            const hype = G.coordination > 75;
            crowdMembers.forEach(c => {
                c.mesh.position.y = c.baseY + Math.abs(Math.sin(elapsed * 6 + c.phase)) * (hype ? 0.22 : 0.06);
                if (c.stick) { c.stick.rotation.z = hype ? Math.sin(elapsed * 7 + c.phase) * 0.9 : -0.3; c.stick.visible = G.coordination > 50; }
            });
            spotlights.forEach(s => {
                const a = Math.sin(elapsed * 0.6 + s.phase) * 0.35, b = Math.cos(elapsed * 0.45 + s.phase) * 0.18;
                s.pivot.rotation.set(b, 0, a);
                s.pool.position.x = s.x - Math.sin(a) * 16; s.pool.position.z = 4 + Math.sin(b) * 16;
                s.cone.material.opacity = 0.05 + G.coordination / 100 * 0.06;
            });
            rimBulbs.forEach((b, i) => { b.material.opacity = 0.55 + 0.45 * Math.max(0, Math.sin(elapsed * 4 - i * 0.6)); });
            const cp = confetti.geometry.attributes.position.array;
            for (let i = 0; i < CONF_N; i++) {
                const v = confVel[i]; cp[i * 3 + 1] -= v.vy * dt; cp[i * 3] += Math.sin(elapsed * 1.5 + v.ph) * dt * 0.6;
                if (cp[i * 3 + 1] < 0) { cp[i * 3 + 1] = 16 + Math.random() * 4; cp[i * 3] = (Math.random() - 0.5) * 30; }
            }
            confetti.geometry.attributes.position.needsUpdate = true;
            confetti.material.opacity = 0.25 + G.coordination / 100 * 0.6;
            stars.material.opacity = 0.65 + Math.sin(elapsed * 1.7) * 0.15;

            for (let i = skyBlessings.length - 1; i >= 0; i--) {
                const b = skyBlessings[i]; b.life -= dt; b.mesh.position.y += b.vy * dt; b.mesh.rotation.y += b.rot * dt; if (!b.isLantern) b.mesh.rotation.x += b.rot * dt;
                if (b.life <= 0) { scene.remove(b.mesh); skyBlessings.splice(i, 1); }
            }

            // 煙火
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i]; r.s.position.y += r.vy * dt; r.vy *= 0.985; r.s.position.x += Math.sin(elapsed * 9 + i) * dt * 0.4;
                r.trailT += dt;
                if (r.trailT > 0.03) { r.trailT = 0; const t = glowSprite(0xffb050, 0.35, 0.7); t.position.copy(r.s.position); scene.add(t); bursts.push({ trail: t, age: 0, max: 0.5 }); }
                if (r.s.position.y >= r.y) { scene.remove(r.s); spawnFirework(r.s.position.x, r.s.position.y, r.s.position.z, G.coordination >= 80 ? 80 : 60, r.opts.type); rockets.splice(i, 1); }
            }
            for (let i = bursts.length - 1; i >= 0; i--) {
                const b = bursts[i]; b.age += dt;
                if (b.trail) { b.trail.material.opacity = 0.7 * (1 - b.age / b.max); if (b.age >= b.max) { scene.remove(b.trail); b.trail.material.dispose(); bursts.splice(i, 1); } continue; }
                if (b.age >= b.max) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); continue; }
                const pa = b.pts.geometry.attributes.position.array;
                for (let j = 0; j < b.vel.length; j++) { const v = b.vel[j]; v.multiplyScalar(b.drag); v.y -= b.g * dt; pa[j * 3] += v.x * dt; pa[j * 3 + 1] += v.y * dt; pa[j * 3 + 2] += v.z * dt; }
                b.pts.geometry.attributes.position.needsUpdate = true;
                const k = b.age / b.max; b.pts.material.opacity = (1 - k * k) * (0.85 + Math.random() * 0.15);
            }
            flashLight.intensity *= Math.pow(0.02, dt);

            // 鏡頭導播
            const cam = _v.set(mx * 1.4, 5.6 + my * 0.7, 17.5), look = _v2.set(0, 3.6, 0);
            if (G.cameraMode === 'dragon') { cam.set(pearlGroup.position.x * 0.55 - 2.2, pearlGroup.position.y + 1.2, 10.8); look.copy(pearlGroup.position); }
            else if (G.cameraMode === 'lion') { cam.set(lion.position.x + 1.2, lion.position.y + 2.2, lion.position.z + 6.5); look.set(lion.position.x, lion.position.y + 1, lion.position.z); }
            else if (G.cameraMode === 'sky') { cam.set(0, 2.2, 14.5); look.set(0, 8.2, -4); }
            else if (G.cameraMode === 'orbit') { cam.set(Math.sin(elapsed * 0.45) * 16.5, 6.2 + Math.sin(elapsed * 0.9) * 1.5, Math.cos(elapsed * 0.45) * 16.5); look.set(0, 3.8, 0); }
            camera.position.lerp(cam, 0.06);
            if (G.shake > 0) { G.shake = Math.max(0, G.shake - dt); camera.position.x += (Math.random() - 0.5) * G.shake * 0.5; camera.position.y += (Math.random() - 0.5) * G.shake * 0.5; }
            camera.lookAt(look);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { resizeStageRenderer(); resizeRightWavePad(); });
        window.addEventListener('load', () => {
            setTier(tier);
            resizeStageRenderer(); resizeRightWavePad();
            animate();
            if (ds.isAuthority) setTimeout(() => { launchFirework(-5, -6, { y: 9.5 }); launchFirework(5, -6, { y: 10.2 }); }, 350);
        });
    </script>
</body>
